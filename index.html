<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin & Craft | Creator Tools</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            background-color: #191919; 
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background-color: #222222;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-top: 5px solid #ffcc00; 
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        p.subtitle {
            font-size: 16px;
            color: #cccccc;
            margin-bottom: 35px;
            line-height: 1.6;
        }
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }
        .cta-button {
            background-color: #ffcc00;
            color: #111111;
            text-decoration: none; /* Removes the underline from links */
            display: block; /* Makes the whole box clickable */
            padding: 18px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease, transform 0.1s ease;
            text-transform: uppercase;
        }
        .cta-button:hover {
            background-color: #e6b800;
        }
        .cta-button:active {
            transform: scale(0.98);
        }
        .secure-text {
            font-size: 12px;
            color: #777777;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Margin & Craft Tools</h1>
        <p class="subtitle">Choose your platform below to unlock your automated business tools.</p>
        
        <div class="button-group">
            <a href="https://appsave.online/cl/i/vejwpd" class="cta-button">
                Unlock Streamlit Business App
            </a>
            
            <a href="https://saveapp.store/cl/i/7jvo9g" class="cta-button">
                Unlock Etsy Pricing Matrix
            </a>
        </div>
        
        <div class="secure-text">
            🔒 Human verification required to prevent bot spam
        </div>
    </div>

</body>
</html>
